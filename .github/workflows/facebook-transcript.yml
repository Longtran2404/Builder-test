name: Facebook Transcript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp faster-whisper
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie

      - name: Download Facebook video and audio
        env:
          FB_URL: 'https://www.facebook.com/share/v/14i9KioNDW5/?mibextid=wwXIfr'
        run: |
          mkdir -p output /tmp/fbframes
          yt-dlp --no-playlist --write-subs --write-auto-subs --sub-langs 'vi.*,en.*' --convert-subs srt -o '/tmp/source.%(ext)s' "$FB_URL"
          SRC=$(ls /tmp/source.* | grep -Ev '\.(srt|vtt|json)$' | head -n 1)
          ffmpeg -y -i "$SRC" -vn -ac 1 -ar 16000 /tmp/audio.wav
          yt-dlp --no-playlist --dump-single-json "$FB_URL" > output/metadata.json || true
          cp /tmp/source*.srt output/ 2>/dev/null || true
          ffmpeg -y -i "$SRC" -vf fps=1/2,scale=1280:-1 /tmp/fbframes/frame_%04d.jpg

      - name: Transcribe audio with Whisper
        run: |
          python - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel

          prompt = (
              'Video tiếng Việt về cách tìm tài liệu nghiên cứu khoa học. '
              'Các tên riêng có thể xuất hiện gồm: Perplexity, Consensus, Elicit, Scite, '
              'ResearchRabbit, Research Rabbit, Connected Papers, Semantic Scholar, Litmaps, '
              'Google Scholar, PubMed, Web of Science, Scopus, The Conversation, Psychology Today, '
              'Neuroscience News, Nature, Science, Cell, Annual Review, Psychological Bulletin.'
          )
          model = WhisperModel('small', device='cpu', compute_type='int8')
          segments, info = model.transcribe(
              '/tmp/audio.wav',
              language='vi',
              beam_size=5,
              vad_filter=True,
              initial_prompt=prompt,
              condition_on_previous_text=True,
          )
          plain=[]
          timed=[]
          for seg in segments:
              text=seg.text.strip()
              if text:
                  plain.append(text)
                  timed.append(f'[{seg.start:07.2f} - {seg.end:07.2f}] {text}')
          Path('output/whisper_transcript.txt').write_text('\n'.join(plain), encoding='utf-8')
          Path('output/whisper_timed.txt').write_text('\n'.join(timed), encoding='utf-8')
          Path('output/language.txt').write_text(str(info.language), encoding='utf-8')
          PY

      - name: OCR visible names and text
        run: |
          : > output/ocr.txt
          for f in /tmp/fbframes/*.jpg; do
            echo "===== $(basename "$f") =====" >> output/ocr.txt
            tesseract "$f" stdout -l eng+vie --psm 6 2>/dev/null >> output/ocr.txt || true
            echo >> output/ocr.txt
          done

      - name: Save result to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/metadata.json output/whisper_transcript.txt output/whisper_timed.txt output/language.txt output/ocr.txt 2>/dev/null || true
          git add output/*.srt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No new result files to commit.'
          else
            git commit -m 'Improve Facebook transcript with Whisper and OCR'
            git push
          fi
