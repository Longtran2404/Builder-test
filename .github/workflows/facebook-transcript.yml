name: Facebook Transcript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp faster-whisper
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Resolve Facebook video and try captions
        env:
          FB_URL: 'https://www.facebook.com/share/v/14i9KioNDW5/?mibextid=wwXIfr'
        run: |
          mkdir -p output
          yt-dlp --no-playlist --write-subs --write-auto-subs --sub-langs 'vi.*,en.*' --skip-download --convert-subs srt -o 'output/video.%(ext)s' "$FB_URL" || true
          yt-dlp --no-playlist --dump-single-json "$FB_URL" > output/metadata.json || true

      - name: Download audio if needed
        env:
          FB_URL: 'https://www.facebook.com/share/v/14i9KioNDW5/?mibextid=wwXIfr'
        run: |
          if ls output/*.srt >/dev/null 2>&1; then
            echo 'Subtitle found; skipping audio download.'
          else
            yt-dlp --no-playlist -x --audio-format mp3 --audio-quality 0 -o 'output/audio.%(ext)s' "$FB_URL"
          fi

      - name: Build transcript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          out = Path('output')
          srts = sorted(out.glob('*.srt'))
          if srts:
              text = srts[0].read_text(encoding='utf-8', errors='ignore')
              lines=[]
              for line in text.splitlines():
                  s=line.strip()
                  if not s or s.isdigit() or '-->' in s:
                      continue
                  s=re.sub(r'<[^>]+>', '', s)
                  if not lines or lines[-1] != s:
                      lines.append(s)
              (out/'transcript.txt').write_text('\n'.join(lines), encoding='utf-8')
              print('Transcript extracted from subtitles:', srts[0])
          else:
              from faster_whisper import WhisperModel
              audios = list(out.glob('audio.*'))
              if not audios:
                  raise SystemExit('No subtitles and no audio were downloaded')
              model = WhisperModel('small', device='cpu', compute_type='int8')
              segments, info = model.transcribe(str(audios[0]), beam_size=5, vad_filter=True)
              lines=[]
              timed=[]
              for seg in segments:
                  t=seg.text.strip()
                  if t:
                      lines.append(t)
                      timed.append(f'[{seg.start:07.2f} - {seg.end:07.2f}] {t}')
              (out/'transcript.txt').write_text('\n'.join(lines), encoding='utf-8')
              (out/'transcript_timed.txt').write_text('\n'.join(timed), encoding='utf-8')
              (out/'language.txt').write_text(str(info.language), encoding='utf-8')
              print('Detected language:', info.language)
          PY

      - name: Save result to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/transcript.txt output/transcript_timed.txt output/language.txt output/metadata.json 2>/dev/null || true
          git add output/*.srt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No result files to commit.'
            exit 1
          fi
          git commit -m 'Add Facebook video transcript'
          git push
